services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Le stockage vit dans un volume nomme : les fichiers uploades survivent
      # a un rebuild, la base SQLite aussi.
      STORAGE_DIR: /data/storage
      DATABASE_URL: sqlite+aiosqlite:////data/meglabs.db
    volumes:
      - ./backend:/app
      - backend_data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    volumes:
      - ./frontend:/app
      # Volume anonyme : garde les node_modules de l'image, que le bind mount
      # du dossier hote masquerait sinon.
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend_data:
