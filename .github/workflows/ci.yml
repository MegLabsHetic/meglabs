name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    name: Backend - lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      # Les tests unitaires tournent sans cle API : les agents sont mockes.
      - name: Pytest
        run: pytest -q -m "not integration"

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker compose lit .env ; en CI on part du fichier d'exemple, qui ne
      # contient que des valeurs factices.
      - name: Seed environment
        run: cp .env.example .env

      - run: docker compose build
